name: Find product images

# Looks for photos for products that have appeared in the database since the last run.
#
# It never publishes. It writes candidates plus a contact sheet and commits those, because
# roughly half of automatic name matches are a different thing with the same name — an
# F/A-18 for "Hornet", a Pentax camera for "K1000", bread for "Palianytsia". Promote the
# good ones with `npm run images:accept -- <indices>`; only then does the site change.

on:
  schedule:
    - cron: "0 7 * * 1"          # Mondays 07:00 UTC, after the daily catalogue build
  workflow_dispatch: {}          # or run on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: find-images
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Search Wikimedia for new product photos
        env:
          SUPABASE_URL: https://uobidcahmrmfdmfbrtkt.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/find-images.mjs

      - name: Summarise for review
        run: node scripts/image-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Commit candidates for review
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data review
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Image candidates for review

          Written by the weekly image search. Nothing is published until these are
          promoted with: npm run images:accept -- <indices>"
            git push
          fi
